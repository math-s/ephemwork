[package]
name = "ephemwork"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aws-config = "1.5"
aws-sdk-ec2 = "1.65"
aws-sdk-ssm = "1.65"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
ssh2 = "0.9"
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
